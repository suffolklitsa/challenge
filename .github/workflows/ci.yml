name: checks
on:
  push:
    branches: [main, staging]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Weights add up
        run: python3 -c "import sys; sys.path.insert(0, '.'); from tools.tabulate import load_weights; load_weights(__import__('pathlib').Path('2027/rubrics/build-weights.toml'))"
